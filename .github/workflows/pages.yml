name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Rebuild daily so the page picks up the nodes' latest reports.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A pull request must not cancel a deployment of main.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download reports and build the site
        # A pull request fails when a configured report cannot be read, for example after a wrong URL in a node's
        # metadata. The other runs use the saved copy of a report instead, so a node that is down does not block them.
        run: python3 scripts/build.py ${{ github.event_name == 'pull_request' && '--strict' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
